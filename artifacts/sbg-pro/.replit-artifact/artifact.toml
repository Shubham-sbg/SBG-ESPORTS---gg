kind = "web"
previewPath = "/sbg-pro/"
title = "SBG ARMY Enterprise Platform"
version = "1.0.0"
id = "artifacts/sbg-pro"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sbg-pro/" ]
localPort = 22913

[services.development]
run = "pnpm --filter @workspace/sbg-pro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sbg-pro", "run", "build" ]
publicDir = "artifacts/sbg-pro/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22913"
BASE_PATH = "/sbg-pro/"
