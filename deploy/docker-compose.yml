version: "3.9"

# Self-hosted alternative to Vercel + Render (e.g. your own VPS). Runs
# Postgres, the API server, and nginx (serving the built sbg-army frontend
# and proxying /api + /ws to the API server) with a real persistent volume
# for CMS data and uploads.
#
# Usage:
#   pnpm --filter @workspace/sbg-army run build   # build the frontend first
#   docker compose -f deploy/docker-compose.yml up -d --build

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sbgarmy
      POSTGRES_USER: sbgarmy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbgarmy"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://sbgarmy:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your .env}@postgres:5432/sbgarmy
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in your .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
    volumes:
      - api_data:/app/artifacts/api-server/database
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../artifacts/sbg-army/dist/public:/usr/share/nginx/html:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api-server

volumes:
  postgres_data:
  api_data:
