# SBG ARMY GG23 — Netlify Deployment Configuration
# Deploys the sbg-army FRONTEND only.
# The backend API server must be deployed separately (Render recommended).

[build]
  # Run from the repo root
  base = "."
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/sbg-army run build"
  publish = "artifacts/sbg-army/dist/public"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# SPA routing — all paths go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy to Render backend (avoids CORS issues)
# Replace YOUR_RENDER_URL with your actual backend URL
[[redirects]]
  from = "/api/*"
  to = "https://sbg-army-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/ws"
  to = "https://sbg-army-api.onrender.com/ws"
  status = 101
  force = true

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables to set in Netlify dashboard:
# VITE_API_URL — your Render backend URL (if not using the proxy above)
# VITE_CLERK_PUBLISHABLE_KEY — optional Clerk key
