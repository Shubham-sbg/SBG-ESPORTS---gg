services:
  - type: web
    name: sbg-army
    env: node
    region: singapore
    plan: free
    buildCommand: bun install && bun run build --workspace=@workspace/api-server
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: LOG_LEVEL
        value: info

  - type: static
    name: sbg-army-frontend
    env: static
    region: singapore
    plan: free
    buildCommand: bun install && bun run build --workspace=@workspace/sbg-army
    publishPath: artifacts/sbg-army/dist
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
